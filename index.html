async function saveEditUser(){
  const id = document.getElementById('edit-user-id').value;
  const name = document.getElementById('edit-user-name').value.trim();
  const pass = document.getElementById('edit-user-pass').value.trim();
  const passConfirm = document.getElementById('edit-user-pass-confirm').value.trim();
  const photo = document.getElementById('edit-user-photo-data').value;
  const roleInput = document.querySelector('input[name="edit-user-role"]:checked');
  const role = roleInput ? roleInput.value : null;

  if(!name){ toast('El nombre no puede estar vacío','error'); return; }
  if(pass || passConfirm){
    if(pass !== passConfirm){ toast('Las contraseñas no coinciden','error'); return; }
    if(pass.length < 6){ toast('La nueva contraseña debe tener al menos 6 caracteres','error'); return; }
  }

  const idx = cache.users.findIndex(u=>u.id===id);
  if(idx===-1){ toast('Usuario no encontrado','error'); return; }
  const prevRole = cache.users[idx].role;
  const email = cache.users[idx].username;

  // 1) Subir la foto al Storage (si cambió) y actualizar el perfil
  const photoUrl = await uploadAvatar(id, photo);
  const upd = { name, photo_url: photoUrl };
  if(role) upd.role = role;
  const { error: profErr } = await sb.from('profiles').update(upd).eq('id', id);
  if(profErr){ toast('Error al actualizar el usuario: '+profErr.message,'error'); return; }

  // 2) Restablecer contraseña si se ingresó una nueva (vía Edge Function)
  if(pass){
    const { error: pwErr } = await adminUsers('resetPassword', { email, password: pass });
    if(pwErr){ toast('Perfil actualizado pero error al cambiar contraseña: '+pwErr,'error'); }
  }

  cache.users[idx].name = name;
  cache.users[idx].photo = photoUrl;
  if(role) cache.users[idx].role = role;

  let logDetails = `${name} (${email})`;
  if(role && role!==prevRole) logDetails += ` · rol: ${prevRole} → ${role}`;
  if(pass) logDetails += ' · contraseña restablecida';
  logActivity('Editó un usuario', logDetails);

  // si el usuario editado es el que tiene la sesión activa, refrescar header y posiblemente recargar la vista
  if(currentUser.id===id){
    currentUser.name = name;
    currentUser.photo = photoUrl;
    if(role) currentUser.role = role;
    document.getElementById('hdr-name').textContent = currentUser.name;
    document.getElementById('hdr-role').textContent = currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1);
    document.getElementById('hdr-avatar').innerHTML = currentUser.photo
      ? `<img src="${currentUser.photo}" alt="${currentUser.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : currentUser.name.charAt(0).toUpperCase();
  }

  closeUserModal();
  toast('Usuario actualizado correctamente');
  if(currentUser.id===id && role && currentUser.role!=='administrador' && currentUser.role!=='gerente'){
    navigate('dashboard');
  } else {
    renderUsers();
  }
}

// Desbloquea una cuenta bloqueada por intentos fallidos (admin/gerente).
async function unlockUser(email){
  const { error } = await sb.from('login_security').update({ locked:false, failed_attempts:0 }).eq('email', (email||'').toLowerCase());
  if(error){ toast('Error al desbloquear: '+error.message,'error'); return; }
  const u = cache.users.find(x=>x.username && x.username.toLowerCase()===(email||'').toLowerCase());
  if(u) u.locked = false;
  logActivity('Desbloqueó un usuario', email);
  toast('Usuario desbloqueado correctamente');
  renderUsers();
}

function confirmDeleteUser(userId){
  const users = cache.users;
  const u = users.find(x=>x.id===userId);
  if(!u) return;

  if(u.id===currentUser.id){ toast('No puedes eliminar tu propia cuenta','error'); return; }
  if(u.role==='administrador' && users.filter(x=>x.role==='administrador').length<=1){
    toast('No puedes eliminar al único administrador del sistema','error');
    return;
  }

  const cnt = cache.clients.filter(c=>c.vendedorId===u.id).length;

  if(cnt>0){
    openReassignBeforeDelete(u, cnt, users);
    return;
  }

  showConfirmModal({
    title: 'Eliminar usuario',
    message: `¿Estás seguro de que deseas eliminar a <strong>${u.name}</strong> (${u.username})?<br><br>Esta acción no se puede deshacer.`,
    confirmLabel: 'Eliminar usuario',
    danger: true,
    onConfirm: async ()=>{
      const { error } = await adminUsers('delete', { email: u.username });
      if(error){ toast('Error al eliminar el usuario: '+error,'error'); return; }
      sb.storage.from('avatars').remove([`${u.id}.jpg`]).catch(()=>{}); // limpia el avatar
      cache.users = cache.users.filter(x=>x.id!==userId);
      logActivity('Eliminó un usuario', `${u.name} (${u.username}) · rol: ${u.role}`);
      toast('Usuario eliminado correctamente');
      renderUsers();
    }
  });
}

// ============================================================
// CONFIRM MODAL (genérico, reemplaza confirm() nativo)
// ============================================================
let _confirmModalCallback = null;
let _confirmModalCancelCallback = null;

// Envuelve showConfirmModal en una promesa: resuelve true si confirma, false si cancela.
function confirmAsync(opts){
  return new Promise(resolve=>{
    showConfirmModal({ ...opts, onConfirm:()=>resolve(true), onCancel:()=>resolve(false) });
  });
}

function showConfirmModal({title='¿Estás seguro?', message='', confirmLabel='Confirmar', cancelLabel='Cancelar', danger=false, onConfirm=null, onCancel=null}){
  _confirmModalCallback = onConfirm;
  _confirmModalCancelCallback = onCancel;
  let overlay = document.getElementById('confirm-modal-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'confirm-modal-overlay';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e)=>{ if(e.target===overlay) closeConfirmModal(); };
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px">
        <div class="modal-header">
          <span class="modal-title" id="confirm-modal-title"></span>
          <button class="modal-close" onclick="closeConfirmModal()" aria-label="Cerrar ventana">&times;</button>
        </div>
        <div class="modal-body" id="confirm-modal-body" style="font-size:14px;color:var(--text2);line-height:1.6"></div>
        <div class="modal-footer" style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-secondary btn-sm" id="confirm-modal-cancel" onclick="closeConfirmModal()"></button>
          <button class="btn btn-sm" id="confirm-modal-accept" onclick="_runConfirmModalCallback()"></button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }
  document.getElementById('confirm-modal-title').textContent = title;
  document.getElementById('confirm-modal-body').innerHTML = message;
  document.getElementById('confirm-modal-cancel').textContent = cancelLabel;
  const acceptBtn = document.getElementById('confirm-modal-accept');
  acceptBtn.textContent = confirmLabel;
  acceptBtn.style.background = danger ? 'var(--red)' : 'var(--blue)';
  acceptBtn.style.color = '#fff';
  overlay.classList.add('open');
}

function _runConfirmModalCallback(){
  const cb = _confirmModalCallback;
  _confirmModalCallback = null;
  _confirmModalCancelCallback = null; // evita que se dispare también el callback de cancelar
  const overlay = document.getElementById('confirm-modal-overlay');
  if(overlay) overlay.classList.remove('open');
  if(typeof cb === 'function') cb();
}

function closeConfirmModal(){
  const overlay = document.getElementById('confirm-modal-overlay');
  if(overlay) overlay.classList.remove('open');
  const cancelCb = _confirmModalCancelCallback;
  _confirmModalCallback = null;
  _confirmModalCancelCallback = null;
  if(typeof cancelCb === 'function') cancelCb();
}

async function confirmReassignAndDelete(userId){
  const u = cache.users.find(x=>x.id===userId);
  if(!u) return;

  const mode = document.getElementById('reassign-mode').value;
  const cnt = cache.clients.filter(c=>c.vendedorId===u.id).length;

  let reassignDetail = '';
  if(mode==='reassign'){
    const targetSel = document.getElementById('reassign-target');
    const targetId = targetSel ? targetSel.value : '';
    const target = cache.users.find(x=>x.id===targetId);
    if(!target){ toast('Selecciona un vendedor válido para reasignar','error'); return; }
    const { error } = await sb.from('clients').update({ vendedor_id: target.id, vendedor_nombre: target.name }).eq('vendedor_id', u.id);
    if(error){ toast('Error al reasignar clientes: '+error.message,'error'); return; }
    cache.clients.forEach(c=>{ if(c.vendedorId===u.id){ c.vendedorId=target.id; c.vendedorNombre=target.name; } });
    reassignDetail = `${cnt} cliente(s) reasignados a ${target.name}`;
  } else {
    const { error } = await sb.from('clients').update({ vendedor_id: null, vendedor_nombre: 'Sin asignar' }).eq('vendedor_id', u.id);
    if(error){ toast('Error al actualizar clientes: '+error.message,'error'); return; }
    cache.clients.forEach(c=>{ if(c.vendedorId===u.id){ c.vendedorId=null; c.vendedorNombre='Sin asignar'; } });
    reassignDetail = `${cnt} cliente(s) quedaron sin vendedor asignado`;
  }

  const { error: delErr } = await adminUsers('delete', { email: u.username });
  if(delErr){ toast('Clientes reasignados, pero error al eliminar el usuario: '+delErr,'error'); return; }
  sb.storage.from('avatars').remove([`${u.id}.jpg`]).catch(()=>{}); // limpia el avatar
  cache.users = cache.users.filter(x=>x.id!==userId);
  logActivity('Eliminó un usuario (con reasignación de clientes)', `${u.name} (${u.username}) · rol: ${u.role} · ${reassignDetail}`);
  closeUserModal();
  toast('Usuario eliminado correctamente');
  renderUsers();
}

function applyTheme(mode){
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(mode==='light') document.body.classList.add('theme-light');
  else if(mode==='dark') document.body.classList.remove('theme-light');
  else { // auto
    if(prefersDark) document.body.classList.remove('theme-light');
    else document.body.classList.add('theme-light');
  }
}

// Genera y descarga un archivo JSON con clientes, usuarios y log de actividad
// (respaldo manual, complementario al respaldo automático diario).
async function downloadFullBackup(){
  if(currentUser.role!=='administrador'){ toast('Solo un administrador puede generar el respaldo','error'); return; }
  const [{data:clients,error:ce},{data:profiles,error:pe},{data:log,error:le}] = await Promise.all([
    sb.from('clients').select('*'),
    sb.from('profiles').select('*'),
    sb.from('activity_log').select('*').order('created_at',{ascending:false})
  ]);
  if(ce||pe||le){ toast('Error al generar el respaldo: '+(ce||pe||le).message,'error'); return; }

  const backup = {
    generado: new Date().toISOString(),
    generado_por: currentUser.name,
    clients, profiles, activity_log: log
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `respaldo_ventas_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  logActivity('Descargó un respaldo completo de datos', `${(clients||[]).length} clientes, ${(profiles||[]).length} usuarios`);
  toast('Respaldo descargado correctamente');
}

async function changePassword(){
  const cur     = document.getElementById('cfg-pass-cur').value.trim();
  const newPass = document.getElementById('cfg-pass-new').value.trim();
  const confirm = document.getElementById('cfg-pass-confirm').value.trim();

  if(!cur || !newPass || !confirm){ toast('Completa todos los campos','error'); return; }
  if(newPass !== confirm){ toast('Las contraseñas nuevas no coinciden','error'); return; }
  if(newPass.length < 6){ toast('La nueva contraseña debe tener al menos 6 caracteres','error'); return; }

  // Verifica la contraseña actual reautenticando, luego la actualiza vía Supabase Auth.
  const { error: signErr } = await sb.auth.signInWithPassword({ email: currentUser.email, password: cur });
  if(signErr){ toast('La contraseña actual es incorrecta','error'); return; }
  const { error: updErr } = await sb.auth.updateUser({ password: newPass });
  if(updErr){ toast('Error al actualizar la contraseña: '+updErr.message,'error'); return; }

  logActivity('Cambió su contraseña', '');
  document.getElementById('cfg-pass-cur').value='';
  document.getElementById('cfg-pass-new').value='';
  document.getElementById('cfg-pass-confirm').value='';
  toast('Contraseña actualizada correctamente');
}

// Re-apply theme when system preference changes (for auto mode)
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if((localStorage.getItem('ap_theme')||'dark')==='auto') applyTheme('auto');
});
// Cierre de sesión automático por inactividad (5 minutos).
const INACTIVITY_MS = 5 * 60 * 1000;
let _inactivityTimer = null;
function resetInactivityTimer(){
  if(!currentUser) return;
  clearTimeout(_inactivityTimer);
  _inactivityTimer = setTimeout(async ()=>{
    if(!currentUser) return;
    await doLogout();
    showLoginError('Tu sesión se cerró por inactividad. Vuelve a iniciar sesión.');
  }, INACTIVITY_MS);
}
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>{
  document.addEventListener(ev, resetInactivityTimer, { passive:true });
});

// Refresca los datos cuando el usuario vuelve a la pestaña (sesiones concurrentes).
// No re-dibuja formularios en edición para no perder lo capturado.
let _lastRefresh = Date.now();
document.addEventListener('visibilitychange', async ()=>{
  if(document.hidden || !currentUser) return;
  if(currentView==='new-client' || currentView==='edit-client') return;
  if(Date.now() - _lastRefresh < 8000) return;
  _lastRefresh = Date.now();
  const ok = await loadAll();
  if(!ok) return;
  const safe = ['dashboard','my-clients','all-clients','vendors-list','users','activity-log','client-detail','documents'];
  if(safe.includes(currentView)) navigate(currentView);
});

// Detecta el regreso desde el enlace de recuperación de contraseña.
let _recoveryMode = window.location.hash.includes('type=recovery');
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){ _recoveryMode = true; showRecoveryModal(); }
});

// Restaura la sesión de Supabase si existe (auto-login), salvo en modo recuperación.
(async ()=>{
  try{
    if(_recoveryMode){ showRecoveryModal(); return; }
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const ok = await _afterAuth(session.user);
      if(ok) enterApp();
    }
  }catch(e){ reportError(e, 'restaurar-sesion'); }
})();

// Red de seguridad: captura errores no atrapados y promesas rechazadas sin
// catch, para no perder visibilidad de fallos inesperados en producción.
window.addEventListener('error', (e)=>{ reportError(e.error||e.message, 'window-error'); });
window.addEventListener('unhandledrejection', (e)=>{ reportError(e.reason, 'unhandled-rejection'); });
</script>
