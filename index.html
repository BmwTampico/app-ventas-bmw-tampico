<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autopremium Tampico — Sistema de Ventas</title>
<style>
:root {
  --navy: #0d1b2a;
  --navy2: #1c2b3a;
  --blue: #1c69d4;
  --blue2: #1a5fbf;
  --blue-light: #4d8fea;
  --white: #ffffff;
  --gray: #8a9bb0;
  --gray2: #c5d0dc;
  --gray3: #e8edf3;
  --gray4: #f4f7fa;
  --red: #e53e3e;
  --green: #38a169;
  --card: #162233;
  --border: #243447;
  --text: #e2eaf5;
  --text2: #8a9bb0;
  --radius: 10px;
  --shadow: 0 4px 24px rgba(13,27,42,0.45);
}
/* ---- LIGHT MODE ---- */
body.theme-light {
  --navy: #f0f4f8;
  --navy2: #e2eaf3;
  --blue: #1c69d4;
  --blue2: #1a5fbf;
  --blue-light: #1a5fbf;
  --white: #0f1f33;
  --gray: #64748b;
  --gray2: #94a3b8;
  --gray3: #cbd5e1;
  --gray4: #e2e8f0;
  --red: #dc2626;
  --green: #16a34a;
  --card: #ffffff;
  --border: #dde3ec;
  --text: #1e293b;
  --text2: #64748b;
  --shadow: 0 4px 24px rgba(28,105,212,0.12);
}
body.theme-light .clients-table tr:hover td { background: #f0f5ff; }
body.theme-light .search-item:hover { background: #f0f5ff; }
body.theme-light .tipo-fisica { background: #ede9fe; color: #6d28d9; }
body.theme-light .tipo-moral  { background: #e0f2fe; color: #0369a1; }
body.theme-light .role-admin    { background: #dbeafe; color: #1d4ed8; }
body.theme-light .role-gerente  { background: #dcfce7; color: #15803d; }
body.theme-light .role-vendedor { background: #ffedd5; color: #c2410c; }
body.theme-light .form-control.valid   { border-color: #16a34a; }
body.theme-light .form-control.invalid { border-color: #dc2626; }
body.theme-light select.form-control option { background: var(--card); }
body.theme-light .stat-card { box-shadow: 0 1px 4px rgba(28,105,212,0.10); }
body.theme-light .app-header { box-shadow: 0 1px 4px rgba(28,105,212,0.12); }
body.theme-light .search-input { box-shadow: 0 1px 3px rgba(28,105,212,0.08); }
body.theme-light .doc-card { box-shadow: 0 1px 4px rgba(28,105,212,0.10); }
body.theme-light .form-card { box-shadow: 0 1px 4px rgba(28,105,212,0.10); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--navy);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--blue-light);text-decoration:none}
input,select,textarea{font-family:inherit}

/* LAYOUT */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* ===== LOGIN ===== */
#page-login.active{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 60% 40%, #1a3a5c 0%, #0d1b2a 70%)}
.pass-wrap{position:relative}
.pass-wrap .form-control{padding-right:46px}
.pass-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray);padding:4px;display:flex;align-items:center;transition:color .2s}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .brand-icon{width:88px;height:88px;background:var(--blue);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.login-logo .brand-icon svg{width:36px;height:36px;fill:white}
.login-logo h1{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-.3px}
.login-logo p{font-size:13px;color:var(--gray);margin-top:4px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray2);margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}
.form-control{width:100%;padding:12px 16px;background:var(--navy);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;transition:border-color .2s;font-variant-numeric:tabular-nums}
.form-control:focus{outline:none;border-color:var(--blue)}
.form-control::placeholder{color:var(--gray)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:background-color .2s ease-out,border-color .2s ease-out,color .2s ease-out,transform .1s ease-out}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--blue);color:white}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-danger{background:#7f1d1d;color:#fca5a5}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid var(--border)}
.btn-sm{padding:7px 14px;font-size:13px;min-height:44px}
.btn-full{width:100%}
.btn-green{background:#166534;color:#86efac}
.login-error{color:#fca5a5;background:#450a0a;border:1px solid #7f1d1d;border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}

/* ===== APP SHELL ===== */
#page-app{display:none;flex-direction:column}
#page-app.active{display:flex}
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;color:var(--white)}
.header-brand .brand-dot{width:54px;height:54px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center}
.header-brand .brand-dot svg{width:18px;height:18px;fill:white}
.header-right{display:flex;align-items:center;gap:16px}
.user-badge{display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white}
.user-info .user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-info .user-role{font-size:11px;color:var(--gray)}
.role-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.role-admin{background:#1e3a5f;color:#60a5fa}
.role-gerente{background:#1a3d2e;color:#4ade80}
.role-vendedor{background:#3d1f0a;color:#fb923c}

/* ===== APP NAV ===== */
.app-nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:60px;z-index:99}
.app-nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:7px;padding:13px 16px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s,transform .1s ease-out;flex-shrink:0}
.nav-item:active{transform:scale(0.96)}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-item.active{color:var(--blue-light);border-bottom-color:var(--blue-light)}

/* ===== MAIN CONTENT ===== */
.app-main{flex:1;padding:28px 24px;max-width:1100px;width:100%;margin:0 auto}

/* ===== DASHBOARD ===== */
.dash-title{font-size:24px;font-weight:700;color:var(--white);margin-bottom:4px}
.dash-subtitle{font-size:14px;color:var(--gray);margin-bottom:28px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;transition:transform .1s ease-out}
.stat-card:active{transform:scale(0.98)}
.stat-card .stat-val{font-size:32px;font-weight:800;color:var(--blue-light);line-height:1;font-variant-numeric:tabular-nums}
.stat-card .stat-lbl{font-size:13px;color:var(--gray);margin-top:6px}
.search-bar-wrap{position:relative;margin-bottom:20px}
.search-bar-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gray)}
.search-input{width:100%;padding:14px 16px 14px 46px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;transition:border-color .2s}
.search-input:focus{outline:none;border-color:var(--blue)}
.search-input::placeholder{color:var(--gray)}
.search-results{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-top:8px;overflow:hidden;display:none}
.search-results.show{display:block}
.search-item{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s,transform .1s ease-out}
.search-item:active{transform:scale(0.98)}
.search-item:last-child{border-bottom:none}
.search-item-name{font-weight:600;font-size:14px;color:var(--text)}
.search-item-sub{font-size:12px;color:var(--gray);margin-top:2px}
.search-no-result{padding:20px;text-align:center}
.search-no-result p{color:var(--gray);font-size:14px;margin-bottom:12px}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700;color:var(--text)}

/* ===== CLIENTS TABLE ===== */
.clients-table{width:100%;border-collapse:collapse}
.clients-table th{text-align:left;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;border-bottom:1px solid var(--border)}
.clients-table td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text)}
.clients-table tr:last-child td{border-bottom:none}
.clients-table tr:hover td{background:#1a2d42;transition:background .15s}
.badge-tipo{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tipo-fisica{background:#1e1a3f;color:#a78bfa}
.tipo-moral{background:#172a3a;color:#38bdf8}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray)}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:14px}

/* ===== FORM ===== */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.form-card h3{font-size:16px;font-weight:700;color:var(--white);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-grid{display:grid;gap:16px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--gray2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.form-group label .req{color:var(--blue-light)}
.form-control{background:var(--navy);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;width:100%;font-size:14px;transition:border-color .2s}
.form-control:focus{outline:none;border-color:var(--blue)}
.form-control.error{border-color:var(--red)}
.field-error{font-size:12px;color:#fca5a5;margin-top:4px;display:none}
.field-error.show{display:block}
.field-ok{font-size:12px;color:#4ade80;margin-top:4px;display:none}
.field-ok.show{display:block}
.form-control.valid{border-color:var(--green)}
.form-control.invalid{border-color:var(--red)}
select.form-control option{background:var(--navy)}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--navy);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:24px;width:fit-content}
.tab-btn{padding:9px 20px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--gray);transition:background-color .2s ease-out,color .2s ease-out}
.tab-btn.active{background:var(--blue);color:white}

/* RADIO BUTTONS */
.radio-group{display:flex;gap:16px;flex-wrap:wrap}
.radio-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text)}
.radio-label input{accent-color:var(--blue);width:16px;height:16px}

/* VEHICLE SECTION */
.vehicle-section{background:linear-gradient(135deg,#0d1e35,#112241);border:1px solid #1c4080;border-radius:var(--radius);padding:24px;margin-bottom:20px}
.vehicle-section h3{color:#60a5fa;font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
body.theme-light .vehicle-section{background:var(--card);border:1px solid var(--border)}
body.theme-light .vehicle-section h3{color:var(--blue2)}

/* FORM ACTIONS */
.form-actions{display:flex;gap:12px;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--border)}

/* ===== DOCUMENT VIEWER ===== */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.doc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .2s;position:relative}
.doc-card-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.doc-icon{width:44px;height:44px;background:#0d2a4a;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-icon svg{width:24px;height:24px;color:#60a5fa}
body.theme-light .doc-icon{background:#e8f0fe}
body.theme-light .doc-icon svg{color:var(--blue)}
.doc-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.doc-desc{font-size:12px;color:var(--gray);margin-top:4px}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap}
.doc-select{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.doc-select input{accent-color:var(--blue);width:16px;height:16px}
.doc-select label{font-size:13px;color:var(--gray)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:800px;margin:auto;box-shadow:0 24px 80px rgba(13,27,42,.6)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700;color:var(--white)}
.modal-close{background:none;border:none;color:var(--gray);cursor:pointer;padding:4px;border-radius:6px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ===== DOCUMENT TEMPLATES (print) ===== */
.doc-template{font-family:Arial,sans-serif;font-size:12px;color:#000;line-height:1.5;max-width:760px;margin:0 auto;background:white;padding:24px}
.doc-template h2{font-size:16px;font-weight:bold;text-align:center;margin-bottom:4px;text-transform:uppercase}
.doc-template h3{font-size:13px;font-weight:bold;margin:16px 0 8px}
.doc-template .doc-meta{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:16px}
.doc-template table{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc-template table th,.doc-template table td{border:1px solid #999;padding:6px 10px;font-size:11px;text-align:left}
.doc-template table th{background:#e0e0e0;font-weight:bold}
.doc-template .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.doc-template .field-item{border-bottom:1px solid #aaa;padding-bottom:4px}
.doc-template .field-label{font-size:10px;color:#666;font-weight:bold;text-transform:uppercase}
.doc-template .field-value{font-size:12px;color:#000}
.doc-template .sig-line{border-top:1px solid #000;width:60%;text-align:center;margin:40px auto 4px;font-size:11px}
.doc-template .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.doc-template .checkbox-box{width:14px;height:14px;border:1px solid #000;display:inline-block;text-align:center;line-height:14px;font-weight:bold}
.doc-template .section-divider{border-top:2px solid #000;margin:16px 0;padding-top:8px}

/* ===== TOAST ===== */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;min-width:260px;max-width:380px;transform:translateX(0);opacity:1;transition:transform .3s cubic-bezier(0.16,1,0.3,1),opacity .25s ease-out}
.toast.toast-enter{transform:translateX(120%);opacity:0}
.toast.leaving{transform:translateX(120%);opacity:0}
.toast span{flex:1;line-height:1.4}
.toast-action{flex-shrink:0;background:transparent;border:none;color:var(--blue-light);font-weight:700;font-size:13px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background-color .15s ease-out}
.toast-close{flex-shrink:0;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;transition:color .15s ease-out,background-color .15s ease-out}
.toast.success{border-color:#166534}
.toast.error{border-color:#7f1d1d}
.toast-icon{width:20px;height:20px;flex-shrink:0}
@media (prefers-reduced-motion: reduce){
  .toast{transition:opacity .25s ease-out}
  .toast.toast-enter,.toast.leaving{transform:none}
}

/* ===== CLIENT DETAIL ===== */
.client-detail-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px}
.client-name{font-size:22px;font-weight:800;color:var(--white)}
.client-sub{font-size:14px;color:var(--gray);margin-top:4px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.detail-card h4{font-size:13px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.detail-field{margin-bottom:10px}
.detail-field .lbl{font-size:11px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.detail-field .val{font-size:14px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}

/* ===== USER MGMT ===== */
.user-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.user-row-info .u-name{font-weight:600;font-size:14px}
.user-row-info .u-detail{font-size:12px;color:var(--gray);margin-top:2px}

/* ===== NAV / BREADCRUMB ===== */
.breadcrumb{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.breadcrumb .sep{color:var(--gray2);font-size:14px;opacity:.5}
.breadcrumb .current{font-size:14px;font-weight:600;color:var(--text2)}
.breadcrumb a{cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.breadcrumb a.back-btn{font-size:13px;font-weight:600;color:var(--text);background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;transition:border-color .15s,color .15s}
.breadcrumb a
/* ===== PRINT ===== */
@media print{
  body{background:white!important;color:#000!important}
  .app-header,.app-nav,.breadcrumb,.form-actions,.doc-actions,.doc-select,.modal-header,.modal-footer,.toast-container,button,.btn,.tabs,.stats-row,.search-bar-wrap,.section-header,.no-print{display:none!important}
  .modal-overlay{position:static!important;background:none!important;display:block!important;padding:0!important}
  .modal{border:none!important;box-shadow:none!important;background:white!important;max-width:100%!important}
  .modal-body{max-height:none!important;overflow:visible!important;padding:0!important}
  .doc-template{padding:0!important}
}

/* ===== RESPONSIVE (tablet) ===== */
@media(max-width:1024px){
  .app-main{padding:22px 18px}
  .stats-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .vendor-card{flex-direction:column;align-items:flex-start!important;gap:14px!important}
  .vendor-card .vendor-card-stats{width:100%;justify-content:space-between}
}

/* ===== RESPONSIVE ===== */
@media(max-width:680px){
  .form-grid-2,.form-grid-3,.form-grid-4{grid-template-columns:1fr}
  .app-main{padding:16px}
  .login-card{padding:28px 20px}
  .stat-card .stat-val{font-size:26px}
  .detail-grid{grid-template-columns:1fr}
  .docs-grid{grid-template-columns:1fr}
  .modal{border-radius:12px 12px 0 0;margin-top:auto}
  .app-header{padding:0 14px;gap:8px}
  .header-brand span{display:none}
  .header-brand .brand-dot{width:40px;height:40px}
  .header-right{gap:8px}
  .user-info{display:none}
  .app-nav{padding:0 14px}
  .nav-item{padding:12px 12px}
  .nav-item span{display:none}
  .nav-item svg{width:18px;height:18px}
}

/* ===== BACK TO DOCS ===== */
.bulk-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;margin-bottom:16px}
.bulk-bar p{font-size:13px;color:var(--gray)}

/* ===== LOADING SPINNER (for buttons mid-operation) ===== */
.btn-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:middle;margin-right:7px;animation:btn-spin .7s linear infinite}
.btn-secondary .btn-spinner,.btn-sm.btn-secondary .btn-spinner{border-color:rgba(28,105,212,.25);border-top-color:var(--blue-light)}
@keyframes btn-spin{to{transform:rotate(360deg)}}
button:disabled,.btn:disabled{opacity:.7;cursor:not-allowed}

/* ===== HOVER (solo dispositivos con puntero fino, ej. mouse) =====
   Evita que los estados :hover queden "pegados" tras un toque en
   tablet/celular, donde no hay verdadero hover. ===== */
@media (hover: hover) and (pointer: fine){
  .pass-toggle:hover{color:var(--text)}
  .btn-primary:hover{background:var(--blue2)}
  .btn-secondary:hover{background:#2d4060}
  .btn-danger:hover{background:#991b1b}
  .btn-ghost:hover{background:var(--border);color:var(--text)}
  .btn-green:hover{background:#15803d}
  .nav-item:hover{color:var(--text)}
  .search-item:hover{background:#1e3350}
  .doc-card:hover{border-color:var(--blue)}
  .modal-close:hover{color:var(--text);background:var(--border)}
  .toast-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .toast-action:hover{background:rgba(77,143,234,.15)}
  .back-btn:hover{border-color:var(--blue);color:var(--blue-light)}
}
</style>
</head>

    <div id="login-error" class="login-error"></div>
    <div class="form-group">
      <label for="inp-user">Correo electrónico</label>
      <input type="email" id="inp-user" class="form-control" placeholder="tucorreo@ejemplo.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="recovery-pass">Contraseña</label>
      <div class="pass-wrap">
        <input type="password" id="inp-pass" class="form-control" placeholder="••••••••" autocomplete="current-password">

          </svg>
        </button>
      </div>
    </div>

  </div>

<!-- ==================== MODAL: NUEVA CONTRASEÑA (recuperación) ==================== -->
<div class="modal-overlay" id="recovery-modal-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title">Definir nueva contraseña</span>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Ingresa tu nueva contraseña de acceso.</p>
      <div class="form-group">
        <label for="recovery-pass">Nueva contraseña</label>
        <input type="password" id="recovery-pass" class="form-control" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label for="recovery-pass-confirm">Confirmar nueva contraseña</label>
        <input type="password" id="recovery-pass-confirm" class="form-control" placeholder="Repite la nueva contraseña">
      </div>
      <button class="btn btn-primary btn-full" onclick="submitRecoveryPassword()" style="margin-top:8px">Guardar contraseña</button>
    </div>
  </div>
</div>

// Caché en memoria; las vistas leen de aquí (síncrono). Las escrituras van
// de forma asíncrona a Supabase y luego actualizan este caché.
const cache = { clients: [], users: [], activity_log: [] };

// ── Mappers entre el objeto de cliente de la app (plano) y la fila de Supabase
// (columnas promovidas + jsonb `data`) ──
function _clientToRow(c){
  const nombre = c.tipo==='fisica'
    ? [c.nombres,c.apellidoPaterno,c.apellidoMaterno].filter(Boolean).join(' ')
    : (c.razonSocial||'');
  const rfc = c.tipo==='fisica' ? (c.rfc||'') : (c.rfcMoral||'');
  const data = {...c};
  ['id','vendedorId','vendedorNombre','fechaRegistro','_printed','_hidden'].forEach(k=>delete data[k]);
  return {
    vendedor_id: c.vendedorId || (currentUser && currentUser.id) || null,
    vendedor_nombre: c.vendedorNombre || (currentUser && currentUser.name) || '',
    tipo: c.tipo,
    nombre, rfc, telefono: c.telefono || '',
    data
  };
}
function _rowToClient(r){
  return {
    ...(r.data||{}),
    id: r.id,
    tipo: r.tipo,
    vendedorId: r.vendedor_id,
    vendedorNombre: r.vendedor_nombre,
    fechaRegistro: r.created_at,
    _printed: r.printed_docs || [],
    _hidden: r.hidden_docs || []
  };
}

// DB.get: lecturas síncronas desde el caché (compatibilidad con el código existente).
// DB.set: solo para preferencias locales (tema); los datos viajan por funciones async.
const DB = {
  get(key){
    if(key==='ap_clients') return cache.clients;
    if(key==='ap_users') return cache.users;
    if(key==='ap_activity_log') return cache.activity_log;
    if(key==='ap_docs_count') return {};
    if(key && key.indexOf('ap_printed_')===0){
      const id=key.slice(11); const c=cache.clients.find(x=>x.id===id); return c?(c._printed||[]):[];
    }
    if(key && key.indexOf('ap_hidden_')===0){
      const id=key.slice(10); const c=cache.clients.find(x=>x.id===id); return c?(c._hidden||[]):[];
    }
    try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; }
  },
  set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
};

// Carga todos los datos visibles desde Supabase hacia el caché (tras iniciar sesión).
async function loadAll(){
  const [{data:profs,error:pe},{data:cls,error:ce},{data:log},{data:locks}] = await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('clients').select('*').order('created_at',{ascending:false}),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(ACTIVITY_LOG_MAX),
    sb.from('login_security').select('email,locked')
  ]);
  if(pe||ce){
    reportError((pe||ce).message||'loadAll falló', 'loadAll');
    toast('Error al cargar datos de Supabase','error'); return false;
  }
  const lockedSet = new Set((locks||[]).filter(l=>l.locked).map(l=>(l.email||'').toLowerCase()));
  cache.users = (profs||[]).map(p=>({ id:p.id, name:p.name, username:p.email, role:p.role, photo:p.photo_url, locked: lockedSet.has((p.email||'').toLowerCase()) }));
  cache.clients = (cls||[]).map(_rowToClient);
  cache.activity_log = (log||[]).map(l=>({ id:l.id, ts:l.created_at, userId:l.user_id, userName:l.user_name, userRole:l.user_role, action:l.action, details:l.details }));
  return true;
}

// Operaciones privilegiadas de cuentas vía la Edge Function 'admin-users'
// (crear/eliminar usuario, restablecer contraseña). La service_role vive en el
// servidor; aquí solo enviamos la sesión y el servidor valida permisos.
async function adminUsers(action, payload){
  const { data, error } = await sb.functions.invoke('admin-users', { body: { action, ...payload } });
  if(error){
    let msg = error.message || 'Error en la operación';
    try{ const ctx = await error.context?.json(); if(ctx?.error) msg = ctx.error; }catch(_){}
    return { error: msg };
  }
  if(data?.error) return { error: data.error };
  return { data };
}

// Sube la foto de perfil al bucket 'avatars' y devuelve su URL pública.
// - Si `photoData` viene vacío → null.
// - Si ya es una URL (http...) → se devuelve igual (no cambió la foto).
// - Si es base64 (data:...) → se convierte a Blob y se sube (upsert por usuario).
async function uploadAvatar(userId, photoData){
  if(!photoData) return null;
  if(photoData.indexOf('data:')!==0) return photoData;
  try{
    const blob = await (await fetch(photoData)).blob();
    const path = `${userId}.jpg`;
    const { error } = await sb.storage.from('avatars').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
    if(error){ toast('Error al subir la foto: '+error.message,'error'); return null; }
    const { data } = sb.storage.from('avatars').getPublicUrl(path);
    return data.publicUrl + '?v=' + Date.now(); // cache-bust para ver la foto nueva al instante
  }catch(e){ console.error('uploadAvatar:', e); toast('No se pudo subir la foto','error'); return null; }
}

function uuid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2) }

// ACTIVITY LOG (auditoría ligera para gerentes/administradores)
// ============================================================
const ACTIVITY_LOG_MAX = 200;
function logActivity(action, details=''){
  if(!currentUser) return;
  // Optimista: actualiza el caché de inmediato y persiste en segundo plano.
  const entry = { id: uuid(), ts: new Date().toISOString(), userId: currentUser.id, userName: currentUser.name, userRole: currentUser.role, action, details };
  cache.activity_log.unshift(entry);
  if(cache.activity_log.length > ACTIVITY_LOG_MAX) cache.activity_log.length = ACTIVITY_LOG_MAX;
  sb.from('activity_log').insert({ user_id: currentUser.id, user_name: currentUser.name, user_role: currentUser.role, action, details })
    .then(({error})=>{ if(error) console.error('logActivity:', error.message); });
}

let currentUser = null;

async function doLogin(){
  const email = document.getElementById('inp-user').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  if(!email || !pass){ showLoginError('Ingresa tu correo y contraseña'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showLoginError('Ingresa un correo electrónico válido'); return; }

  // 1) ¿La cuenta está bloqueada por intentos fallidos?
  const { data: isLocked } = await sb.rpc('login_is_locked', { p_email: email });
  if(isLocked){ showLoginError('Tu cuenta está bloqueada por demasiados intentos fallidos. Contacta al administrador para desbloquearla.'); return; }

  // 2) Intentar iniciar sesión
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){
    // Registrar el intento fallido (bloquea al llegar a 5)
    const { data: res } = await sb.rpc('login_record_failure', { p_email: email });
    if(res && res.locked){
      showLoginError('Cuenta bloqueada tras 5 intentos fallidos. Contacta al administrador.');
    } else {
      const left = res ? (5 - res.attempts) : null;
      showLoginError('Correo o contraseña incorrectos.' + (left!==null && left>0 ? ` Te queda(n) ${left} intento(s) antes del bloqueo.` : ''));
    }
    return;
  }

  // 3) Éxito: reiniciar el contador y entrar
  await sb.rpc('login_reset', { p_email: email });
  const ok = await _afterAuth(data.user);
  if(ok) enterApp();
}

// Tras autenticarse: obtiene el perfil (nombre/rol/foto) y carga los datos.
async function _afterAuth(authUser){
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  if(error || !prof){
    showLoginError('Tu cuenta no tiene un perfil asignado. Contacta al administrador.');
    await sb.auth.signOut();
    return false;
  }
  currentUser = { id: prof.id, name: prof.name, role: prof.role, photo: prof.photo_url, email: prof.email };
  return await loadAll();
}

// Envía el correo de recuperación de contraseña al correo escrito en el login.
async function forgotPassword(){
  const email = document.getElementById('inp-user').value.trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showLoginError('Escribe tu correo arriba y vuelve a pulsar "¿Olvidaste tu contraseña?"');
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ showLoginError('No se pudo enviar el correo: '+error.message); return; }
  toast('Te enviamos un enlace de recuperación a '+email+'. Revisa tu correo (y la carpeta de spam).');
}

// Muestra el modal para definir la nueva contraseña (al volver desde el correo).
function showRecoveryModal(){
  document.getElementById('page-login').classList.add('active');
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('recovery-modal-overlay').classList.add('open');
}

async function submitRecoveryPassword(){
  const p1 = document.getElementById('recovery-pass').value.trim();
  const p2 = document.getElementById('recovery-pass-confirm').value.trim();
  if(!p1 || p1.length < 6){ toast('La contraseña debe tener al menos 6 caracteres','error'); return; }
  if(p1 !== p2){ toast('Las contraseñas no coinciden','error'); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ toast('Error al actualizar la contraseña: '+error.message,'error'); return; }
  document.getElementById('recovery-modal-overlay').classList.remove('open');
  await sb.auth.signOut();
  history.replaceState(null, '', window.location.pathname); // limpia el token del URL
  document.getElementById('recovery-pass').value='';
  document.getElementById('recovery-pass-confirm').value='';
  toast('Contraseña actualizada. Ya puedes iniciar sesión con la nueva.');
}

async function doLogout(){
  clearTimeout(_inactivityTimer);
  await sb.auth.signOut();
  currentUser = null;
  cache.clients = []; cache.users = []; cache.activity_log = [];
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('page-login').classList.add('active');
  document.getElementById('inp-user').value='';
  document.getElementById('inp-pass').value='';
}

function showLoginError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display='block';
  setTimeout(()=>el.style.display='none', 4000);
}

function enterApp(){
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  document.getElementById('hdr-name').textContent = currentUser.name;
  document.getElementById('hdr-role').textContent = currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1);
  document.getElementById('hdr-avatar').innerHTML = currentUser.photo
    ? `<img src="${currentUser.photo}" alt="${currentUser.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : currentUser.name.charAt(0).toUpperCase();
  navigate('dashboard');
  resetInactivityTimer();
}

let currentView = 'dashboard';
let currentClientId = null;
let editMode = false;
let prefillName = '';

function navigate(view, opts={}){
  // Si hay cambios sin guardar en el formulario de cliente y el usuario intenta
  // salir hacia otra vista (incluyendo vía la barra de navegación), confirmamos antes.
  if(_clientFormDirty && (currentView==='new-client'||currentView==='edit-client') && view!==currentView){
    showConfirmModal({
      title:'¿Descartar cambios sin guardar?',
      message:'Has capturado información en este formulario que aún no se ha guardado. Si continúas, se perderá.',
      confirmLabel:'Descartar y salir',
      cancelLabel:'Seguir editando',
      danger:true,
      onConfirm:()=>{ _clientFormDirty = false; navigate(view, opts); }
    });
    return;
  }
  currentView = view;
  if(opts.clientId !== undefined) currentClientId = opts.clientId;
  if(opts.editMode !== undefined) editMode = opts.editMode;
  if(opts.prefill  !== undefined) prefillName = opts.prefill;
  else prefillName = '';
  const main = document.getElementById('app-content');
  if(view==='dashboard') renderDashboard();
  else if(view==='new-client') renderClientForm(null);
  else if(view==='edit-client') renderClientForm(currentClientId);
  else if(view==='client-detail') renderClientDetail(currentClientId);
  else if(view==='documents') renderDocuments(currentClientId);
  else if(view==='users') renderUsers();
  else if(view==='settings') renderSettings();
  else if(view==='my-clients') renderMyClients();
  else if(view==='all-clients') renderAllClients();
  else if(view==='vendors-list') renderVendorsList();
  else if(view==='vendor-clients') renderVendorClients(opts.vendorId);
  else if(view==='activity-log') renderActivityLog();
  renderNav();
}

// ============================================================
// TOAST
// ============================================================
// Ejecuta una operación potencialmente "pesada" (exportar, generar/imprimir
// documentos) mostrando un estado de carga en el botón que la disparó, para
// evitar dobles clics y dar sensación de respuesta inmediata.
// Versión asíncrona: deshabilita el botón con spinner hasta que la promesa
// termina. Evita dobles clics que crearían registros duplicados.
async function runAsync(btn, loadingLabel, fn){
  if(!btn || btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.setAttribute('aria-busy','true');
  btn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>${loadingLabel}`;
  try{ await fn(); }
  finally{
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.innerHTML = original;
  }
}

function runWithLoading(btn, loadingLabel, fn){
  if(!btn || btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.setAttribute('aria-busy','true');
  btn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>${loadingLabel}`;
  setTimeout(()=>{
    try{ fn(); }
    finally{
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.innerHTML = original;
    }
  }, 30);
}

// `opts.actionLabel` + `opts.onAction` agregan un botón dentro del toast
// (ej. "Deshacer") para revertir la acción sin bloquear el flujo con un
// modal — solo aparece si algo salió mal, y no exige ninguna decisión si
// todo estuvo bien (el toast se autodescarta solo).
function toast(msg, type='success', opts={}){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className='toast '+(type==='success'?'success':'error');
  t.setAttribute('role', type==='success' ? 'status' : 'alert');
  const icon = type==='success'
    ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const actionBtn = opts.actionLabel ? `<button class="toast-action">${opts.actionLabel}</button>` : '';
  t.innerHTML = icon + '<span>'+msg+'</span>' + actionBtn + '<button class="toast-close" aria-label="Cerrar notificación">&times;</button>';

  // Los errores (y los toasts con acción, ej. "Deshacer") permanecen más
  // tiempo visibles, ya que requieren que el usuario lea y decida antes de
  // que se pierda la oportunidad de actuar.
  const duration = opts.duration || (opts.actionLabel ? 30000 : (type==='success' ? 3200 : 6500));
  let dismissTimer = null;
  const startDismiss = ()=>{
    dismissTimer = setTimeout(()=>{
      t.classList.add('leaving');
      setTimeout(()=>t.remove(), 300);
    }, duration);
  };
  const cancelDismiss = ()=>{ if(dismissTimer){ clearTimeout(dismissTimer); dismissTimer=null; } };
  const closeNow = ()=>{
    cancelDismiss();
    t.classList.add('leaving');
    setTimeout(()=>t.remove(), 300);
  };

  if(opts.actionLabel && opts.onAction){
    t.querySelector('.toast-action').onclick = ()=>{ opts.onAction(); closeNow(); };
  }
  t.querySelector('.toast-close').onclick = closeNow;
  // Pausa el cierre automático mientras el usuario lee/interactúa con el toast
  t.addEventListener('mouseenter', cancelDismiss);
  t.addEventListener('mouseleave', startDismiss);
  t.addEventListener('focusin', cancelDismiss);
  t.addEventListener('focusout', startDismiss);

  // Arranca en el estado "afuera" (toast-enter) y se retira en el siguiente
  // frame para que la transición (no keyframes) anime la entrada — así, si
  // se cierra a medio camino, la salida continúa desde la posición actual
  // en vez de saltar, sin importar en qué punto de la entrada vaya.
  t.classList.add('toast-enter');
  c.appendChild(t);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ t.classList.remove('toast-enter'); }); });
  startDismiss();
}

function roleClass(){
  if(!currentUser) return '';
  const m = {administrador:'role-admin',gerente:'role-gerente',vendedor:'role-vendedor'};
  return m[currentUser.role]||'';
}

const _debounceTimers = {};
function debounceCall(key, fn, delay=220){
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key] = setTimeout(fn, delay);
}

function liveSearch(q){
  const box = document.getElementById('search-results');
  if(!q||q.length<2){ box.classList.remove('show'); return; }
  const clients = getVisibleClients();
  const lq = q.toLowerCase();
  const found = clients.filter(c=>{
    const name = c.tipo==='fisica'?`${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}`:c.razonSocial;
    const rfc = c.tipo==='fisica'?c.rfc:c.rfcMoral;
    return name.toLowerCase().includes(lq)||(rfc&&rfc.toLowerCase().includes(lq));
  });
  let html='';
  if(found.length===0){
    html=`<div class="search-no-result"><p>No se encontró ningún cliente con ese nombre o RFC.</p><button class="btn btn-primary btn-sm" onclick="navigate('new-client',{prefill:document.getElementById('dash-search').value.trim()})">+ Registrar nuevo cliente</button></div>`;
  } else {
    found.slice(0,8).forEach(c=>{
      const name = c.tipo==='fisica'?`${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}`:c.razonSocial;
      const rfc = c.tipo==='fisica'?c.rfc:c.rfcMoral;
      html+=`<div class="search-item" onclick="navigate('client-detail',{clientId:'${c.id}'})" role="button" tabindex="0" aria-label="Ver cliente ${name}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">
        <div><div class="search-item-name">${name}</div><div class="search-item-sub">${rfc||''} · ${c.tipo==='fisica'?'Persona Física':'Persona Moral'}</div></div>
        <span class="badge-tipo ${c.tipo==='fisica'?'tipo-fisica':'tipo-moral'}">${c.tipo==='fisica'?'PF':'PM'}</span>
      </div>`;
    });
  }
  box.innerHTML=html; box.classList.add('show');
}

let activeTipo = 'fisica';
let _clientFormDirty = false; // true cuando el usuario modifica el formulario sin guardar

function parsePrefillName(){
  const parts = prefillName.trim().split(/\s+/).filter(Boolean);
  // Solo distribuir si son exactamente 3 palabras (nombre + 2 apellidos)
  if(parts.length === 3){
    return {
      nombres:         parts[0],
      apellidoPaterno: parts[1],
      apellidoMaterno: parts[2],
      razonSocial:     prefillName.trim(),
    };
  }
  // Cualquier otra cantidad: todo en nombres, apellidos vacíos
  return {
    nombres:         prefillName.trim(),
    apellidoPaterno: '',
    apellidoMaterno: '',
    razonSocial:     prefillName.trim(),
  };
}

function _clientNameRfc(c){
  const name = c.tipo==='fisica'?`${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}`:c.razonSocial;
  const rfc = c.tipo==='fisica'?c.rfc:c.rfcMoral;

function v(obj, key, def=''){
  return obj && obj[key] !== undefined ? String(obj[key]).replace(/"/g,'&quot;') : def;
}

function switchTipo(tipo){
  activeTipo=tipo;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.includes(tipo==='fisica'?'Física':'Moral')));
  renderTipoFields(null);
}

function renderTipoFields(client){
  const c = client;
  const tf = document.getElementById('tipo-fields');
  if(!tf) return;
  if(activeTipo==='fisica') tf.innerHTML = buildFisicaFields(c);
  else tf.innerHTML = buildMoralFields(c);
}

// CURRENCY HELPERS
// ============================================================
function parseCurrency(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  return parseFloat(el.value.replace(/[^0-9.]/g,'')) || 0;
}

function fmtCurrencyVal(raw){
  if(raw===''||raw===undefined||raw===null) return '';
  const n = parseFloat(String(raw).replace(/[^0-9.]/g,''));
  if(isNaN(n)||n===0) return '';
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:2});
}

function onCurrencyInput(el){
  const raw = el.value.replace(/[^0-9.]/g,'');
  if(raw===''){el.value='';return;}
  const n = parseFloat(raw);
  if(isNaN(n)){el.value='';return;}
  // Preserve trailing dot while user is typing decimals
  const hasDot = el.value.includes('.');
  el.value = '$' + n.toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:2}) + (hasDot && !String(n).includes('.')? '.':'');
}

function calcMontoTotal(){
  const precio    = parseCurrency('f-precio');
  const fsos      = parseCurrency('f-fsos');
  const descuento = parseCurrency('f-descuento');
  const total     = precio + fsos - descuento;
  const el = document.getElementById('f-subvencion');
  if(el) el.value = total > 0 ? fmtCurrencyVal(total) : '';
}


function g(id){ const el=document.getElementById(id); return el?el.value.trim():'' }

async function saveClient(e, existingId){
  e.preventDefault();
  const _btn = e.submitter || (e.target && e.target.querySelector && e.target.querySelector('button[type=submit]'));
  if(_btn){ if(_btn.disabled) return; _btn.disabled = true; _btn._orig = _btn.innerHTML; _btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Guardando...'; }
  try {
  let client = {};
  if(activeTipo==='fisica'){
    // Campos obligatorios básicos
    const required = [
      {id:'f-nombres',   label:'Nombre(s)'},
      {id:'f-appaterno', label:'Apellido Paterno'},
      {id:'f-apmaterno', label:'Apellido Materno'},
      {id:'f-fnac',      label:'Fecha de Nacimiento'},
      {id:'f-curp',      label:'CURP'},
      {id:'f-rfc',       label:'RFC'},
      {id:'f-calle',     label:'Calle'},
      {id:'f-numext',    label:'Número Exterior'},
      {id:'f-colonia',   label:'Colonia'},
      {id:'f-municipio', label:'Municipio'},
      {id:'f-ciudad',    label:'Ciudad'},
      {id:'f-estado',    label:'Estado'},
      {id:'f-cp',        label:'Código Postal'},
      {id:'f-tel',       label:'Teléfono'},
      {id:'f-correo',    label:'Correo Electrónico'},
    ];
    for(const f of required){
      const el = document.getElementById(f.id);
      if(!el || !el.value.trim()){
        toast('Campo requerido: ' + f.label, 'error');
        if(el) el.focus();
        return;
      }
    }
    // Validar CURP (solo longitud)
    const curpEl = document.getElementById('f-curp');
    if(curpEl.value.trim() && !validateCURP(curpEl)){
      curpEl.focus(); toast('La CURP debe tener exactamente 18 caracteres', 'error'); return;
    }
    // Validar RFC (formato)
    const rfcEl = document.getElementById('f-rfc');
    if(!validateRFCFisica(rfcEl)){
      rfcEl.focus(); toast('El RFC no tiene el formato correcto (ej. ABCD010101ABC)', 'error'); return;
    }
    Object.assign(client,{
      tipo:'fisica',
      nombres:g('f-nombres'), apellidoPaterno:g('f-appaterno'), apellidoMaterno:g('f-apmaterno'),
      fechaNacimiento:g('f-fnac'), paisNacimiento:g('f-pnac'), paisNacionalidad:g('f-pnac2'),
      curp:g('f-curp'), rfc:g('f-rfc'), actividad:g('f-actividad'),
      idNombre:g('f-id-nombre'), idAutoridad:g('f-id-aut'), idFolio:g('f-id-folio'),
    });
  } else {
    // Campos obligatorios Persona Moral
    const required = [
      {id:'f-razon',      label:'Razón Social'},
      {id:'f-rfc-moral',  label:'RFC de la empresa'},
      {id:'f-fconst',     label:'Fecha de Constitución'},
      {id:'f-giro',       label:'Giro Mercantil'},
      {id:'f-calle',      label:'Calle'},
      {id:'f-numext',     label:'Número Exterior'},
      {id:'f-colonia',    label:'Colonia'},
      {id:'f-municipio',  label:'Municipio'},
      {id:'f-ciudad',     label:'Ciudad'},
      {id:'f-estado',     label:'Estado'},
      {id:'f-cp',         label:'Código Postal'},
      {id:'f-tel',        label:'Teléfono'},
      {id:'f-correo',     label:'Correo Electrónico'},
      {id:'f-rep-nombres',label:'Nombre del Representante'},
      {id:'f-rep-pat',    label:'Apellido Paterno del Representante'},
      {id:'f-rep-mat',    label:'Apellido Materno del Representante'},
      {id:'f-rep-fnac',   label:'Fecha de Nacimiento del Representante'},
      {id:'f-rep-curp',   label:'CURP del Representante'},
    ];
    for(const f of required){
      const el = document.getElementById(f.id);
      if(!el || !el.value.trim()){
        toast('Campo requerido: ' + f.label, 'error');
        if(el) el.focus();
        return;
      }
    }
    // Validar RFC Moral
    const rfcMoralEl = document.getElementById('f-rfc-moral');
    if(!validateRFCMoral(rfcMoralEl)){
      rfcMoralEl.focus(); toast('El RFC de la empresa no tiene el formato correcto (ej. ABC010101ABC)', 'error'); return;
    }
    // Validar CURP representante
    const repCurpEl = document.getElementById('f-rep-curp');
    if(repCurpEl && repCurpEl.value.trim() && !validateCURP(repCurpEl)){
      repCurpEl.focus(); toast('La CURP del representante debe tener exactamente 18 caracteres', 'error'); return;
    }
    // Validar RFC representante (opcional pero si está debe ser válido)
    const repRfcEl = document.getElementById('f-rep-rfc');
    if(repRfcEl && repRfcEl.value.trim() && !validateRFCFisica(repRfcEl)){
      repRfcEl.focus(); toast('El RFC del representante no tiene el formato correcto', 'error'); return;
    }
    Object.assign(client,{
      tipo:'moral',
      razonSocial:g('f-razon'), rfcMoral:g('f-rfc-moral'),
      fechaConstitucion:g('f-fconst'), paisNacionalidad:g('f-pnac-moral'), gireMercantil:g('f-giro'),
      repNombres:g('f-rep-nombres'), repApellidoPaterno:g('f-rep-pat'), repApellidoMaterno:g('f-rep-mat'),
      repFechaNacimiento:g('f-rep-fnac'), repCurp:g('f-rep-curp'), repRfc:g('f-rep-rfc'),
      repIdNombre:g('f-rep-id-nombre'), repIdAutoridad:g('f-rep-id-aut'), repIdFolio:g('f-rep-id-folio'),
    });
  }
  Object.assign(client,{
    calle:g('f-calle'), numExterior:g('f-numext'), numInterior:g('f-numint'),
    colonia:g('f-colonia'), municipio:g('f-municipio'), ciudad:g('f-ciudad'),
    estado:g('f-estado'), cp:g('f-cp'), pais:g('f-pais'),
    telefono:g('f-tel'), telefonoCasa:g('f-tel-casa'), extension:g('f-ext'), correo:g('f-correo'),
    vehiculoMarca:g('f-marca'), vehiculoSubmarca:g('f-submarca'), vehiculoTipo:'',
    vehiculoColor:g('f-color'), vehiculoAnio:g('f-anio'), vehiculoNIV:g('f-niv'),
    vehiculoMotor:g('f-motor'),
    vehiculoCapacidad:g('f-capacidad'), vehiculoPrecio:parseCurrency('f-precio'),
    vehiculoFechaEntrega:g('f-fecha-ent'), vehiculoLugar:g('f-lugar-ent'),
    entregaFechaSalida:g('f-fecha-salida'), entregaHoraSalida:g('f-hora-salida'),
    entregaFolio:g('f-folio'), entregaNoFactura:g('f-no-factura'),
    entregaNoOrden:g('f-no-orden'), entregaPlacas:g('f-placas'),
    entregaObservaciones:(document.getElementById('f-obs-entrega')||{value:''}).value,
    formaPago:g('f-pago'), cfdi:g('f-cfdi'),
    telefonoOficina:g('f-tel-ofic'),
    fsos:parseCurrency('f-fsos'), descuento:parseCurrency('f-descuento'), subvencion:parseCurrency('f-subvencion'),
    fuente:g('f-fuente'), vecesCompra:g('f-veces-compra'),
  });

  // Aviso de posible cliente duplicado por RFC (revisa en todo el sistema, no solo los propios)
  const rfcVal = (client.tipo==='fisica' ? client.rfc : client.rfcMoral) || '';
  if(rfcVal){
    const { data: dup } = await sb.rpc('client_rfc_exists', { p_rfc: rfcVal, p_exclude: existingId || null });
    if(dup && dup.exists){
      const esPropio = dup.vendedor_id && currentUser.id && dup.vendedor_id === currentUser.id;
      const msg = esPropio
        ? `Ya existe en <strong>tu listado de clientes</strong> un registro con el RFC <strong>${rfcVal}</strong>.<br><br>¿Deseas registrarlo de todos modos?`
        : `El RFC <strong>${rfcVal}</strong> ya está registrado a nombre de <strong>otro vendedor${dup.vendedor?`: ${dup.vendedor}`:''}</strong>, por eso <strong>no aparece en tu listado</strong>.<br><br>¿Deseas registrarlo de todos modos?`;
      const ok = await confirmAsync({
        title: 'Cliente posiblemente duplicado',
        message: msg,
        confirmLabel: 'Registrar de todos modos',
        cancelLabel: 'Cancelar',
        danger: true
      });
      if(!ok) return; // el finally re-habilita el botón
    }
  }

  const nombreLog = client.tipo==='fisica'?(client.nombres+' '+client.apellidoPaterno+' '+client.apellidoMaterno):client.razonSocial;
  if(existingId){
    const prev = cache.clients.find(c=>c.id===existingId) || {};
    const row = _clientToRow({...client, vendedorId: prev.vendedorId, vendedorNombre: prev.vendedorNombre});
    // Los documentos cambian si los datos del cliente cambian: se reinician
    // tanto el estado de "impreso" como el de "oculto" para que vuelvan a
    // aparecer en la lista y puedan generarse de nuevo con los datos nuevos.
    row.printed_docs = [];
    row.hidden_docs = [];
    const { data: updated, error } = await sb.from('clients').update(row).eq('id', existingId).select().single();
    if(error){ toast('Error al actualizar el cliente: '+error.message,'error'); return; }
    const idx = cache.clients.findIndex(c=>c.id===existingId);
    if(idx>-1) cache.clients[idx] = _rowToClient(updated);
    logActivity('Editó un cliente', nombreLog);
    toast('Cliente actualizado correctamente');
    _clientFormDirty = false;
    navigate('client-detail',{clientId:existingId});
  } else {
    const row = _clientToRow(client);
    const { data: inserted, error } = await sb.from('clients').insert(row).select().single();
    if(error){ toast('Error al registrar el cliente: '+error.message,'error'); return; }
    const newClient = _rowToClient(inserted);
    cache.clients.unshift(newClient);
    logActivity('Registró un nuevo cliente', nombreLog);
    toast('Cliente registrado correctamente');
    _clientFormDirty = false;
    navigate('documents',{clientId:newClient.id});
  }
  } catch(err){
    reportError(err, 'saveClient');
    toast('Error inesperado al guardar: ' + err.message, 'error');
  } finally {
    if(_btn){ _btn.disabled = false; _btn.innerHTML = _btn._orig; }
  }
}

function showFieldError(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4000);
}

// ============================================================
// VALIDACIÓN CURP Y RFC
// ============================================================
// CURP: 4 letras + 6 dígitos fecha + H/M + 2 letras estado + 3 consonantes + 1 dígito verificador
const CURP_REGEX = /^[A-Z]{4}\d{6}[HM](AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9]$/;

// RFC Persona Física: 4 letras + 6 dígitos + 3 alfanuméricos (homoclave)
const RFC_PF_REGEX = /^[A-Z&Ñ]{4}\d{6}[A-Z0-9]{3}$/;

// RFC Persona Moral: 3 letras + 6 dígitos + 3 alfanuméricos
const RFC_PM_REGEX = /^[A-Z&Ñ]{3}\d{6}[A-Z0-9]{3}$/;

const CURP_ERRORS = {
  length:  'La CURP debe tener exactamente 18 caracteres',
  format:  'Formato inválido. Estructura: 4 letras · fecha (AAMMDD) · H/M · estado · 3 consonantes · dígito',
  date:    'La fecha de nacimiento en la CURP no es válida (posiciones 5-10: AAMMDD)',
};

function setCurpRfcState(input, okId, errId, valid, errMsg){
  input.classList.toggle('valid', valid);
  input.classList.toggle('invalid', !valid);
  const ok  = document.getElementById(okId);
  const err = document.getElementById(errId);
  if(ok)  ok.classList.toggle('show', valid);
  if(err){ err.textContent = valid ? '' : errMsg; err.classList.toggle('show', !valid); }
}

function validateCURP(input){
  const val = input.value.trim();
  const okId  = 'ok-' + input.id.slice(2);
  const errId = 'e-'  + input.id.slice(2);
  if(val.length === 0){ input.classList.remove('valid','invalid'); clearValidation(input); return true; }
  if(val.length !== 18){ setCurpRfcState(input, okId, errId, false, 'La CURP debe tener exactamente 18 caracteres (lleva '+val.length+')'); return false; }
  setCurpRfcState(input, okId, errId, true, ''); return true;
}

function validateRFCFisica(input){
  const val = input.value.trim();
  if(val.length === 0){ input.classList.remove('valid','invalid'); clearValidation(input); return true; }
  const suffix = input.id; // f-rfc or f-rep-rfc
  const okId  = suffix==='f-rfc' ? 'ok-rfc'  : 'ok-rep-rfc';
  const errId = suffix==='f-rfc' ? 'e-rfc'   : 'e-rep-rfc';
  if(val.length < 12){ setCurpRfcState(input,okId,errId,false,'RFC incompleto (mínimo 12 caracteres)'); return false; }
  if(!RFC_PF_REGEX.test(val)){ setCurpRfcState(input,okId,errId,false,'RFC inválido. Estructura: 4 letras + fecha (AAMMDD) + 3 homoclave'); return false; }
  if(!validRFCDate(val.slice(4,10))){ setCurpRfcState(input,okId,errId,false,'La fecha en el RFC no es válida'); return false; }
  setCurpRfcState(input,okId,errId,true,''); return true;
}

function validateRFCMoral(input){
  const val = input.value.trim();
  if(val.length === 0){ input.classList.remove('valid','invalid'); clearValidation(input); return true; }
  if(val.length < 11){ setCurpRfcState(input,'ok-rfc-moral','e-rfc-moral',false,'RFC de persona moral incompleto (mínimo 11 caracteres)'); return false; }
  if(!RFC_PM_REGEX.test(val)){ setCurpRfcState(input,'ok-rfc-moral','e-rfc-moral',false,'RFC inválido. Estructura: 3 letras + fecha (AAMMDD) + 3 homoclave'); return false; }
  if(!validRFCDate(val.slice(3,9))){ setCurpRfcState(input,'ok-rfc-moral','e-rfc-moral',false,'La fecha en el RFC no es válida'); return false; }
  setCurpRfcState(input,'ok-rfc-moral','e-rfc-moral',true,''); return true;
}

function validRFCDate(str){
  // str = AAMMDD
  const yy=parseInt(str.slice(0,2)), mm=parseInt(str.slice(2,4)), dd=parseInt(str.slice(4,6));
  if(mm<1||mm>12||dd<1||dd>31) return false;
  const year = yy <= new Date().getFullYear()%100 ? 2000+yy : 1900+yy;
  const dt = new Date(year, mm-1, dd);
  return dt.getMonth()===mm-1 && dt.getDate()===dd;
}

function clearValidation(input){
  const base = input.id.slice(2);
  const ok  = document.getElementById('ok-'+base);
  const err = document.getElementById('e-'+base);
  if(ok)  ok.classList.remove('show');
  if(err) err.classList.remove('show');
}

function confirmDeleteClient(clientId){
  if(currentUser.role!=='administrador'){ toast('Solo un administrador puede eliminar clientes','error'); return; }
  const c = cache.clients.find(x=>x.id===clientId);
  if(!c) return;
  const name = c.tipo==='fisica'?`${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}`:c.razonSocial;
  showConfirmModal({
    title: 'Eliminar cliente',
    message: `¿Estás seguro de que deseas eliminar a <strong>${name}</strong>?<br><br>Se borrarán sus datos del sistema. Esta acción no se puede deshacer.`,
    confirmLabel: 'Eliminar cliente',
    danger: true,
    onConfirm: async ()=>{
      const { error } = await sb.from('clients').delete().eq('id', clientId);
      if(error){ toast('Error al eliminar el cliente: '+error.message,'error'); return; }
      cache.clients = cache.clients.filter(x=>x.id!==clientId);
      logActivity('Eliminó un cliente', name);
      toast('Cliente eliminado correctamente');
      navigate('dashboard');
    }
  });
}

}

// Carga diferida de las plantillas de documentos (templates.js, ~7 MB).
// Solo se descargan la primera vez que se genera/previsualiza un documento,
// para mantener ligera la carga diaria (login, listas, captura).
let _templatesPromise = null;
function ensureTemplates(){
  if(window._templatesLoaded) return Promise.resolve();
  if(_templatesPromise) return _templatesPromise;
  _templatesPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'templates.js';
    s.onload = ()=>{ window._templatesLoaded = true; resolve(); };
    s.onerror = ()=>{ _templatesPromise = null; reject(new Error('No se pudieron cargar las plantillas')); };
    document.head.appendChild(s);
  });
  return _templatesPromise;
}

// Contexto del documento/cliente actualmente en el modal, para que
// printModal() sepa qué marcar como impreso justo cuando de verdad se envía
// a la impresora (no antes) — evita el toast/ocultamiento prematuro si el
// usuario solo está viendo la vista previa y aún no imprime.
let _modalPrintContext = null;

async function previewDoc(docId, clientId){
  const clients = DB.get('ap_clients')||[];
  const c = clients.find(x=>x.id===clientId);
  if(!c) return;
  try{ await ensureTemplates(); }catch(e){ toast('No se pudieron cargar las plantillas de documentos. Revisa tu conexión.','error'); return; }
  const html = buildDocHtml(docId, c);
  document.getElementById('modal-title').textContent = docTitle(docId);
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
  _modalPrintContext = { clientId, docIds: [docId] };
  // increment count
  const _dm1=DB.get('ap_docs_count')||{}; _dm1[currentUser.id]=(_dm1[currentUser.id]||0)+1; DB.set('ap_docs_count',_dm1);
}

// Marca documento(s) como impresos y los oculta de la lista de este cliente
// (solo vuelven a aparecer si se editan y guardan los datos del cliente).
function markPrinted(docIds, clientId){
  const client = cache.clients.find(c=>c.id===clientId);
  if(!client) return;
  const printed = client._printed || (client._printed = []);
  const hidden = client._hidden || (client._hidden = []);
  const isNew = docIds.some(id=>!printed.includes(id));
  docIds.forEach(id=>{
    if(!printed.includes(id)) printed.push(id);
    if(!hidden.includes(id)) hidden.push(id);
  });
  if(isNew){
    sb.from('clients').update({ printed_docs: printed, hidden_docs: hidden }).eq('id', clientId)
      .then(({error})=>{ if(error) console.error('markPrinted:', error.message); });
    const clientName = client.tipo==='fisica'?`${client.nombres} ${client.apellidoPaterno} ${client.apellidoMaterno}`:client.razonSocial;
    logActivity('Generó/imprimió documento(s)', `${docIds.length} documento(s) para ${clientName}`);
    // Toast no bloqueante con "Deshacer": si todo salió bien no exige nada
    // (se autodescarta), pero da una salida inmediata si hubo un problema
    // al imprimir (atasco, PDF mal generado, etc.) sin tener que editar
    // los datos del cliente para recuperar el documento.
    const msg = docIds.length>1 ? `${docIds.length} documentos enviados a imprimir y ocultados de la lista` : 'Documento enviado a imprimir y ocultado de la lista';
    toast(msg, 'success', { actionLabel:'Deshacer', onAction:()=>undoMarkPrinted(docIds, clientId) });
  }
  // Retira las tarjetas de la vista con una animación breve; si ya no queda
  // ninguna, se vuelve a dibujar la vista para mostrar el estado vacío.
  let removedAny = false;
  docIds.forEach(id=>{
    const card = document.getElementById('doc-'+id);
    if(!card) return;
    removedAny = true;
    card.style.transition='opacity .3s'; card.style.opacity='0';
    setTimeout(()=>{
      // Si se pulsó "Deshacer" antes de que terminara la animación, el
      // documento ya no está oculto — no lo removemos (evita deshacer el
      // "Deshacer" por una condición de carrera).
      if(!client._hidden || !client._hidden.includes(id)){ card.style.opacity='1'; return; }
      card.remove();
      if(!document.querySelector('.docs-grid .doc-card')) navigate('documents',{clientId});
    },300);
  });
  if(!removedAny && currentView==='documents') navigate('documents',{clientId});
}

// Revierte markPrinted: quita los documentos de "impreso"/"oculto" para que
// vuelvan a aparecer en la lista sin tener que editar los datos del cliente.
async function undoMarkPrinted(docIds, clientId){
  const client = cache.clients.find(c=>c.id===clientId);
  if(!client) return;
  client._printed = (client._printed||[]).filter(id=>!docIds.includes(id));
  client._hidden = (client._hidden||[]).filter(id=>!docIds.includes(id));
  const { error } = await sb.from('clients').update({ printed_docs: client._printed, hidden_docs: client._hidden }).eq('id', clientId);
  if(error){ toast('Error al deshacer: '+error.message,'error'); return; }
  const clientName = client.tipo==='fisica'?`${client.nombres} ${client.apellidoPaterno} ${client.apellidoMaterno}`:client.razonSocial;
  logActivity('Deshizo la impresión de documento(s)', `${docIds.length} documento(s) para ${clientName}`);
  if(currentView==='documents') navigate('documents',{clientId});
  toast('Documento(s) restaurado(s) a la lista');
}

async function printDoc(docId, clientId){
  // La ventana de impresión se abre con el botón "Imprimir / PDF" dentro del
  // modal (clic directo del usuario) — abrirla automáticamente aquí rompe la
  // "activación de usuario" que exigen los navegadores para window.open, y
  // algunos bloqueadores de pop-ups la detienen silenciosamente. El
  // documento se marca como impreso hasta que printModal() confirma que la
  // ventana realmente se envió a imprimir (ver _modalPrintContext).
  await previewDoc(docId, clientId);
}

async function printSelected(clientId){

  const clients = DB.get('ap_clients')||[];
  const c = clients.find(x=>x.id===clientId);
  let combined = '';
  checkboxes.forEach(cb=>{
    combined += buildDocHtml(cb.value, c) + '<div style="page-break-after:always"></div>';
  });
  document.getElementById('modal-title').textContent = 'Documentos Seleccionados';
  document.getElementById('modal-body').innerHTML = combined;

  const _dm2=DB.get('ap_docs_count')||{}; _dm2[currentUser.id]=(_dm2[currentUser.id]||0)+checkboxes.length; DB.set('ap_docs_count',_dm2);
  const selectedIds = Array.from(checkboxes).map(cb=>cb.value);
  // Se marcan como impresos hasta que printModal() confirme que la ventana

  const m={pedido:'Pedido',a1:'Formato A1',a2:'Formato A2','amda-pf':'Identificación AMDA PF','amda-pm':'Identificación AMDA PM','cv-contado':'Compraventa al Contado','cv-tasa':'Compraventa a Tasa Fija / Financiera BMW'};

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); _modalPrintContext = null; }
function closeModalOutside(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }
function printModal(){
  const content = document.getElementById('modal-body').innerHTML;
  const isLandscape = content.includes('ent-page') || content.includes('ent-wrapper');
  const pageRule = isLandscape
    ? '@page{size:letter landscape;margin:8mm}'
    : '@page{size:letter portrait;margin:15mm}';
  const win = window.open('','_blank');
  if(!win){
    toast('El navegador bloqueó la ventana de impresión. Permite ventanas emergentes para este sitio e inténtalo de nuevo.','error');
    reportError('window.open devolvió null (posible bloqueador de pop-ups)', 'printModal');
    return;
  }
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Documento</title>
  <style>body{font-family:Arial,sans-serif;font-size:12px;color:#000;margin:20px}
  table{width:100%;border-collapse:collapse;margin-bottom:12px}
  table th,table td{border:1px solid #999;padding:6px 10px;font-size:11px}
  table th{background:#e0e0e0;font-weight:bold}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .field-item{border-bottom:1px solid #aaa;padding-bottom:4px}
  .field-label{font-size:10px;color:#666;font-weight:bold;text-transform:uppercase}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
  .checkbox-box{width:14px;height:14px;border:1px solid #000;display:inline-block;text-align:center;line-height:14px}
  .sig-line{border-top:1px solid #000;width:60%;margin:40px auto 4px;text-align:center;font-size:11px}
  h2{font-size:16px;font-weight:bold;text-align:center;text-transform:uppercase;margin-bottom:4px}
  h3{font-size:13px;font-weight:bold;margin:16px 0 8px}
  .section-divider{border-top:2px solid #000;margin:16px 0;padding-top:8px}
  @media print{${pageRule}}</style></head>
  <body>${content}</body></html>`);
  win.document.close();
  win.focus();

  // Los navegadores no exponen a JavaScript si el usuario imprimió o
  // canceló el diálogo nativo (restricción de privacidad) — pero sí
  // notifican cuándo ese diálogo se cerró, con 'afterprint'. Esperamos a
  // ese momento para marcar el documento, así el toast nunca aparece
  // mientras el diálogo sigue abierto ni antes de que el usuario decida.
  let settled = false;
  const finishPrint = ()=>{
    if(settled) return;
    settled = true;
    if(_modalPrintContext){
      markPrinted(_modalPrintContext.docIds, _modalPrintContext.clientId);
      _modalPrintContext = null;
    }
    try{ win.close(); }catch(e){}
  };
  win.onafterprint = finishPrint;
  setTimeout(()=>{
    try{ win.print(); }catch(e){}
    // Respaldo: si el navegador no dispara 'afterprint' en esta ventana
    // (pasa en algunos casos, ej. Safari con ventanas emergentes), no se
    // deja el documento sin resolver — se marca tras un margen razonable.
    setTimeout(finishPrint, 4000);
  },500);
}

function _timeAgo(iso){
  const d = new Date(iso);
  const diffMs = Date.now() - d.getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return 'hace un momento';
  if(min < 60) return `hace ${min} min`;
  const hrs = Math.floor(min/60);
  if(hrs < 24) return `hace ${hrs} h`;
  const days = Math.floor(hrs/24);
  if(days < 7) return `hace ${days} día(s)`;
  return d.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
}

const ACTIVITY_PAGE_SIZE = 30;

          <div style="font-size:12px;color:var(--gray);margin-top:4px">${_timeAgo(item.ts)} · <span class="role-pill ${item.userRole==='administrador'?'role-admin':item.userRole==='gerente'?'role-gerente':'role-vendedor'}" style="font-size:10px;padding:2px 8px">${item.userRole}</span></div>

// Recorta la imagen a un cuadrado centrado y la redimensiona/comprime
// antes de convertirla a base64, para no saturar el localStorage ni
// distorsionar el avatar circular.
function processAvatarImage(file, maxSize, cb){
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen','error'); return; }
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2;
      const sy = (img.height - side)/2;
      const canvas = document.createElement('canvas');
      canvas.width = maxSize; canvas.height = maxSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ toast('No se pudo procesar la imagen seleccionada','error'); };
    img.src = ev.target.result;
  };
  reader.onerror = ()=>{ toast('No se pudo leer el archivo seleccionado','error'); };
  reader.readAsDataURL(file);
}

async function saveNewUser(){
  const name = document.getElementById('new-user-name').value.trim();
  const username = document.getElementById('new-user-username').value.trim();
  const pass = document.getElementById('new-user-pass').value.trim();
  const passConfirm = document.getElementById('new-user-pass-confirm').value.trim();
  const photo = document.getElementById('new-user-photo-data').value;
  const roleInput = document.querySelector('input[name="new-user-role"]:checked');
  const role = roleInput ? roleInput.value : 'vendedor';

  if(!name){ toast('El nombre es obligatorio','error'); return; }
  if(!username){ toast('El correo electrónico es obligatorio','error'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)){ toast('Ingresa un correo electrónico válido','error'); return; }
  if(!pass || pass.length < 6){ toast('La contraseña debe tener al menos 6 caracteres','error'); return; }
  if(pass !== passConfirm){ toast('Las contraseñas no coinciden','error'); return; }

  if(cache.users.some(u=>u.username && u.username.toLowerCase()===username.toLowerCase())){
    toast('Ese correo ya está registrado','error'); return;
  }

  // 1) Crear la cuenta de acceso (Auth) en el servidor
  const { data: created, error: authErr } = await adminUsers('create', { email: username, password: pass });
  if(authErr){ toast('Error al crear la cuenta: '+authErr,'error'); return; }
  const authUserId = created.authUserId;

  // 2) Subir la foto al Storage (si hay) y crear el perfil
  const photoUrl = await uploadAvatar(authUserId, photo);
  const { error: profErr } = await sb.from('profiles').insert({ id: authUserId, name, email: username, role, photo_url: photoUrl });
  if(profErr){
    await adminUsers('delete', { email: username }); // rollback de la cuenta de acceso
    toast('Error al crear el perfil: '+profErr.message,'error'); return;
  }

  cache.users.push({ id: authUserId, username, role, name, photo: photoUrl });
  logActivity('Creó un nuevo usuario', `${name} (${username}) · rol: ${role}`);
  closeUserModal();
  toast('Usuario creado correctamente');
  renderUsers();
}
